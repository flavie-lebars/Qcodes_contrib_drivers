# SIMULATED INSTRUMENT FOR Keysight 33502A amplifier
spec: "1.1"
devices:
  Keysight_33502A:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"

    error: ERROR

    dialogues:
      - q: "*IDN?"
        r: "QCoDeS, 33502A, 1, 0.1"

    properties:
      coupling_ch1:
        default: "DC"
        getter:
          q: "INPut1:COUPling?"
          r: "{:.2f}"
        setter:
          q: "INPut1:COUPling {}"
        specs:
          valid: ["DC", "AC"]

      impedance_ch1:
        default: 1000000
        getter:
          q: "INPut1:IMPedance?"
          r: "{:.2f}"
        setter:
          q: "INPut1:IMPedance {}"
        specs:
          min: 50
          max: 1000000
          type: int

      path_ch1:
        default: "DIR"
        getter:
          q: "ROUTe1:PATH?"
          r: "{:.2f}"
        setter:
          q: "ROUTe1:PATH {}"
        specs:
          valid: ["DIR", "AMPL"]

      state_ch1:
        default: 0
        getter:
          q: "OUTPut1:STATe?"
          r: "{:.2f}"
        setter:
          q: "OUTPut1:STATe {}"
        specs:
          valid: [0, 1]

resources:
  GPIB::1::INSTR:
    device: Keysight_33502A
